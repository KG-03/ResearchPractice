<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>Re-Budget-book</title>
        <link rel="stylesheet" href="Re-Budget-Book.css">
    </head>

    <body>
        <header>
            <h1>Re 가계부</h1>
            <p class="today-date">오늘 날짜: 00월 00일</p>
        </header>

        <main>
            <section class="summary-area">
                <h2 class="selected-month">n년 n월 통계</h2>

                <div class="summary-sort">
                    <div class="summary-month-area">
                        <p><b>전체 통계</b></p>
                        
                        <div class="summary-month-list">
                        </div>
                    </div>

                    <div class="summary-category-area">
                        <div class="summary-category-option">
                            <p><b>카테고리별 요약</b></p>
                            
                            <select class="summary-category-type">
                                <option value="expense">지출</option>
                                <option value="income">수입</option>
                                <option value="saving">저축</option>
                                <option value="investment">투자/재테크</option>
                            </select>
                        </div>
                        
                        <div class="summary-category-list">
                        </div>
                    </div>
                </div>

                <button class="prev-month-btn">⬅️이전 달</button>
                <button class="now-month-btn">이번 달</button>
                <button class="next-month-btn">다음 달➡️</button>

                <div>
                    <input class="date-shift" type="month">
                    <button class="shift-month-btn">이동</button>
                </div>
            </section>

            <section class="input-area">
                <h2>입력</h2>
                <input class="date-input" type="date">
                
                <input class="amount-input" type="number" placeholder="금액">
                
                <select class="type-select">
                    <option value="expense">지출</option>
                    <option value="income">수입</option>
                    <option value="saving">저축</option>
                    <option value="investment">투자/재테크</option>
                </select>

                <select class="category-select">
                    <option>카테고리</option>
                </select>

                <input class="description-input" placeholder="메모">

                <button class="add-btn">추가</button>
            </section>

            <section class="filter-area">
                <h2>필터</h2>
                <button class="filter-reset">필터 리셋</button>

                <select class="type-filter">
                    <option value="all">전체</option>
                    <option value="expense">지출</option>
                    <option value="income">수입</option>
                    <option value="saving">저축</option>
                    <option value="investment">투자/재테크</option>
                </select>

                <select class="category-filter">
                    <option>카테고리</option>
                </select>

                <select class="sort-filter">
                    <option value="latest">최신순</option>
                    <option value="oldest">오래된순</option>
                    <option value="dates_asc">날짜 오름차순</option>
                    <option value="dates_desc">날짜 내림차순</option>
                    <option value="amount_asc">가격 오름차순</option>
                    <option value="amount_desc">가격 내림차순</option>
                </select>
            </section>

            <section class="budget-list">
                <p>아직 등록된 기록이 없습니다!</p>
            </section>

        </main>

        <script src="Re-Budget-book.js"></script>
    </body>
</html>
